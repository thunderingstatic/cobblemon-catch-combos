plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.95'
}

group = 'net.thunderingstatic'
version = '1.0.0-clean'

base {
    archivesName = 'cobblemon-catch-combos'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = '21.1.235'
}

def configuredCobblemonJar = providers.gradleProperty('cobblemon_jar').orNull
def cobblemonJar = configuredCobblemonJar != null
        ? file(configuredCobblemonJar)
        : file('libs/Cobblemon-neoforge-1.7.3+1.21.1.jar')

if (!cobblemonJar.exists()) {
    throw new GradleException("""
Cobblemon dependency not found.

Copy Cobblemon-neoforge-1.7.3+1.21.1.jar into:
  ${file('libs').absolutePath}

Or build with:
  .\\gradlew build -Pcobblemon_jar=\"C:/full/path/to/Cobblemon-neoforge-1.7.3+1.21.1.jar\"
""".stripIndent())
}

dependencies {
    compileOnly files(cobblemonJar)
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
}

tasks.withType(ProcessResources).configureEach {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}
